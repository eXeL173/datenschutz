<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Datenschutzerklärungen</title>
<style>
  :root { --grund: #fffaf3; --text: #2b2420; --leise: #6b5f57; --akzent: #4a4de6; }
  @media (prefers-color-scheme: dark) { :root { --grund: #1c1a22; --text: #f3efe9; --leise: #b9b0a6; --akzent: #9fa1ff; } }
  body { background: var(--grund); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
  h1 { font-size: 1.6rem; line-height: 1.25; }
  h2 { font-size: 1.2rem; margin-top: 2.2rem; }
  a { color: var(--akzent); }
  code { font-size: .9em; word-break: break-all; }
  .fuss { color: var(--leise); font-size: .9rem; margin-top: 3rem; }
</style>
</head>
<body><main>
<h1>Datenschutzerklärungen</h1>
<p>Für jede App die eigene Datenschutzerklärung.</p>
<ul>
<li><a href="zahlenwerk/">Zahlenwerk</a></li>
</ul>
<p class="fuss">Diese Seite enthält keine Cookies, keine Skripte und keine eingebundenen Inhalte Dritter.</p>
</main></body>
</html>
